<html>  
<head>  
<title> Mini Notes</title>  
</head>  
<body>  
<h2> MINI NOTES </h2>  
<form action="/" method="POST">     
<input type="text" name="note" placeholder="Enter your notes here"/>  
<input type="submit" value="DONE">
</form>  
<h3>Your Note:</h3>
{% for note in notes %}
    <p>{{ note }}</p>
    <form action="/delete" method="POST">     
    <input type="hidden" name="id" value="{{ note[0] }}"/>  
    <input type="submit" value="DELETE">
    </form>  
{% endfor %}
</body>
</html>
